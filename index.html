<style>
body { margin: 0; }
img { max-width: 100%; }
[hidden] { display: none !important; }
.champ a, .award a, .roll .ch a { color: inherit; text-decoration: none; }
.champ a:hover, .award a:hover, .roll .ch a:hover { color: var(--neon); }
.share { margin-left: auto; border: 1px solid var(--line-hi); background: rgba(15, 32, 69, .6); color: var(--ice); border-radius: 8px; padding: 6px 12px; font-family: var(--f-display); font-size: 13px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; cursor: pointer; max-width: 100%; overflow-wrap: anywhere; }
.share:hover { border-color: var(--neon); color: var(--ink); box-shadow: var(--glow); }

/* Animated hub logos */
.portal-ico { width: 72px; height: 72px; border-radius: 18px; display: grid; place-items: center; color: var(--c); background: radial-gradient(circle at 50% 40%, color-mix(in srgb, var(--c) 22%, transparent), transparent 70%), rgba(2, 7, 19, .6); border: 1px solid color-mix(in srgb, var(--c) 40%, var(--line)); box-shadow: 0 0 24px color-mix(in srgb, var(--c) 25%, transparent); }
.ico { width: 56px; height: 56px; overflow: visible; filter: drop-shadow(0 0 6px color-mix(in srgb, currentColor 60%, transparent)); }
.ico .ball, .ico .ring, .ico .sparkle { transform-box: fill-box; }
.ico-football .ball { transform-origin: center; animation: ball-spin 2.4s linear infinite; }
@keyframes ball-spin { to { transform: rotate(360deg); } }
.ico-swords .ring { transform-origin: center; animation: ball-spin 9s linear infinite; }
.ico .shine { animation: shine 3.2s ease-in-out infinite; }
@keyframes shine { 0%, 35% { transform: skewX(-20deg) translateX(0); } 75%, 100% { transform: skewX(-20deg) translateX(110px); } }
.ico .sparkle { transform-origin: center; animation: sparkle 3.2s ease-in-out infinite; }
@keyframes sparkle { 0%, 55% { transform: scale(0) rotate(0); opacity: 0; } 70% { transform: scale(1.1) rotate(45deg); opacity: 1; } 85%, 100% { transform: scale(0) rotate(90deg); opacity: 0; } }
.ico-players .p { opacity: .32; animation: pick-p 3.6s ease-in-out infinite; }
.ico-players .p2 { animation-delay: 0s; }
.ico-players .p1 { animation-delay: -2.4s; }
.ico-players .p0 { animation-delay: -1.2s; }
@keyframes pick-p { 0%, 30% { opacity: 1; transform: translateY(-2px); } 36%, 100% { opacity: .32; transform: none; } }
.ico-players .pick { animation: pick-bar 3.6s ease-in-out infinite; }
@keyframes pick-bar { 0%, 30% { transform: translateX(18px); } 34%, 63% { transform: translateX(0); } 67%, 96% { transform: translateX(-18px); } 100% { transform: translateX(18px); } }
.hall-title { display: flex; align-items: center; gap: 12px; }
.hall-title .ico { width: 40px; height: 40px; }
@media (prefers-reduced-motion: reduce) { .ico * { animation: none !important; } .ico-players .p2 { opacity: 1; } }
.loading { padding-block: 120px; text-align: center; color: var(--muted); font-family: var(--f-display); letter-spacing: .2em; text-transform: uppercase; }
.loaderr { margin-top: 40px; border: 1px solid var(--loss); border-radius: 14px; padding: 20px; background: rgba(255, 107, 138, .08); display: grid; gap: 8px; }
.loaderr strong { font-family: var(--f-display); letter-spacing: .06em; text-transform: uppercase; color: var(--loss); }
.loaderr code { font-family: var(--f-num); font-size: 14px; color: var(--ice); }
</style>
<style>
/* Layout: dark stadium-at-night world. Sticky nav, neon hero over a perspective field grid, league "portals", then league/season/player views in one column. Deliberately single-theme (dark). */
:root {
  --bg: #040A18;
  --bg-2: #071129;
  --surface: #0A1733;
  --surface-2: #0F2045;
  --line: #1A3366;
  --line-hi: #2A4F96;
  --ink: #E6F1FF;
  --muted: #8EA6CC;
  --neon: #2EC5FF;
  --electric: #3D7BFF;
  --ice: #BFE9FF;
  --gold: #FFD166;
  --win: #4DF0B0;
  --loss: #FF6B8A;
  --glow: 0 0 24px rgba(46, 197, 255, .35);
  --f-display: "Chakra Petch", "Arial Narrow", system-ui, sans-serif;
  --f-body: "Barlow", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-num: "IBM Plex Mono", ui-monospace, Consolas, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { background: var(--bg); }
body {
  background:
    radial-gradient(1100px 520px at 80% -10%, rgba(61, 123, 255, .22), transparent 60%),
    radial-gradient(900px 500px at -10% 10%, rgba(46, 197, 255, .14), transparent 60%),
    var(--bg);
  color: var(--ink); font-family: var(--f-body); font-size: 16px; line-height: 1.55; min-height: 100vh;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.wrap { max-width: 1120px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
h1, h2, h3, h4 { margin: 0; text-wrap: balance; font-family: var(--f-display); letter-spacing: .02em; }
p { margin: 0; }
a { color: var(--neon); }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--neon); outline-offset: 3px; border-radius: 4px; }
.num { font-family: var(--f-num); font-variant-numeric: tabular-nums; }
.kicker { font-family: var(--f-display); font-size: 12px; font-weight: 600; letter-spacing: .22em; text-transform: uppercase; color: var(--neon); }
.muted { color: var(--muted); }

/* Nav */
.nav { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 6; background: rgba(4, 10, 24, .82); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
.nav .wrap { display: flex; align-items: center; gap: 8px 22px; padding-block: 10px; flex-wrap: wrap; }
.logo { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--ink); margin-right: auto; }
.logo-mark { width: 34px; height: 34px; border-radius: 9px; display: grid; place-items: center; font-family: var(--f-display); font-weight: 700; font-size: 13px; color: var(--bg); background: linear-gradient(135deg, var(--neon), var(--electric)); box-shadow: var(--glow); }
.logo-text { font-family: var(--f-display); font-weight: 700; font-size: 19px; letter-spacing: .08em; }
.logo-text span { color: var(--neon); }
.links { display: flex; gap: 2px; overflow-x: auto; max-width: 100%; scrollbar-width: none; }
.links a { text-decoration: none; color: var(--muted); font-family: var(--f-display); font-weight: 600; font-size: 14px; letter-spacing: .06em; text-transform: uppercase; padding: 8px 12px; border-radius: 8px; white-space: nowrap; }
.links a:hover { color: var(--ink); background: var(--surface); }
.links a[aria-current="page"] { color: var(--ink); box-shadow: inset 0 -2px 0 var(--neon); border-radius: 8px 8px 0 0; }

main { padding-block: 0 80px; }
.view { display: grid; gap: 36px; }
.section { display: grid; gap: 16px; }
.section-head { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 8px 16px; }
.section-head h2 { font-size: 24px; font-weight: 700; text-transform: uppercase; }
.yardline { height: 10px; background: repeating-linear-gradient(90deg, var(--line-hi) 0 2px, transparent 2px 28px); opacity: .55; mask-image: linear-gradient(90deg, transparent, #000 15%, #000 85%, transparent); -webkit-mask-image: linear-gradient(90deg, transparent, #000 15%, #000 85%, transparent); }

/* Hero */
.hero { position: relative; overflow: hidden; border-bottom: 1px solid var(--line); }
.hero-field { position: absolute; inset: 35% -30% -40%; background-image:
  linear-gradient(rgba(46, 197, 255, .28) 1px, transparent 1px),
  linear-gradient(90deg, rgba(46, 197, 255, .14) 1px, transparent 1px);
  background-size: 100% 56px, 9.09% 100%;
  transform: perspective(500px) rotateX(62deg); transform-origin: top center;
  mask-image: linear-gradient(to bottom, transparent, #000 25%, #000 70%, transparent);
  -webkit-mask-image: linear-gradient(to bottom, transparent, #000 25%, #000 70%, transparent); pointer-events: none; }
.hero .wrap { position: relative; padding-block: 64px 72px; display: grid; gap: 18px; }
.hero h1 { font-size: clamp(52px, 11vw, 120px); font-weight: 700; line-height: .9; letter-spacing: .03em; text-transform: uppercase; }
.hero h1 .b { color: var(--ink); text-shadow: 0 0 30px rgba(61, 123, 255, .5); }
.hero h1 .f { display: block; color: transparent; -webkit-text-stroke: 1.5px var(--neon); text-shadow: 0 0 28px rgba(46, 197, 255, .45); }
.hero .lede { max-width: 56ch; color: var(--ice); font-size: 18px; }
.hero-stats { display: flex; flex-wrap: wrap; gap: 10px 28px; margin-top: 6px; }
.hero-stats div { display: grid; }
.hero-stats .v { font-family: var(--f-display); font-weight: 700; font-size: 30px; line-height: 1.1; color: var(--ink); }
.hero-stats .k { font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
@media (prefers-reduced-motion: no-preference) {
  .hero-field { animation: drive 6s linear infinite; }
  @keyframes drive { from { background-position: 0 0, 0 0; } to { background-position: 0 56px, 0 0; } }
}

/* Portals */
.portals { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 16px; margin-top: 36px; }
.portal { --c: var(--neon); position: relative; display: grid; gap: 14px; align-content: start; padding: 20px; border-radius: 16px; text-decoration: none; color: var(--ink);
  background: linear-gradient(160deg, color-mix(in srgb, var(--c) 16%, var(--surface)) 0%, var(--surface) 55%); border: 1px solid color-mix(in srgb, var(--c) 35%, var(--line)); min-width: 0; transition: transform .18s, box-shadow .18s, border-color .18s; }
.portal:hover { transform: translateY(-3px); border-color: var(--c); box-shadow: 0 0 0 1px var(--c), 0 10px 40px color-mix(in srgb, var(--c) 30%, transparent); }
.portal .idx { font-family: var(--f-num); font-size: 12px; color: var(--c); letter-spacing: .1em; }
.portal h3 { font-size: 23px; font-weight: 700; line-height: 1.1; text-transform: uppercase; }
.portal .facts { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.portal .facts div { display: grid; gap: 1px; min-width: 0; }
.portal .facts .k { font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
.portal .facts .v { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.portal .go { font-family: var(--f-display); font-weight: 600; font-size: 14px; letter-spacing: .08em; text-transform: uppercase; color: var(--c); }
.portal.players { --c: var(--ice); }
.status { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.status.live { color: var(--win); }
.status.live::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--win); box-shadow: 0 0 10px var(--win); }

/* Panels */
.panel { background: rgba(10, 23, 51, .78); border: 1px solid var(--line); border-radius: 16px; padding: 20px; display: grid; gap: 14px; min-width: 0; }
.panel h3 { font-size: 16px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--ice); }
.grid-2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 16px; }
.soon { border: 1px dashed var(--line-hi); border-radius: 12px; padding: 18px; color: var(--muted); display: grid; gap: 6px; background: rgba(15, 32, 69, .35); }
.soon strong { color: var(--ice); font-family: var(--f-display); letter-spacing: .06em; text-transform: uppercase; font-size: 14px; }

/* League header */
.league-head { --c: var(--neon); position: relative; overflow: hidden; border-bottom: 1px solid var(--line); background: linear-gradient(180deg, color-mix(in srgb, var(--c) 14%, transparent), transparent); }
.league-head .wrap { position: relative; padding-block: 40px 0; display: grid; gap: 14px; }
.crumbs { display: flex; flex-wrap: wrap; gap: 6px; font-size: 13px; color: var(--muted); }
.crumbs a { color: var(--muted); text-decoration: none; }
.crumbs a:hover { color: var(--ink); }
.crumbs span::before { content: "/"; margin-right: 6px; color: var(--line-hi); }
.league-head h1 { font-size: clamp(34px, 6.5vw, 64px); font-weight: 700; line-height: .98; text-transform: uppercase; text-shadow: 0 0 34px color-mix(in srgb, var(--c) 45%, transparent); }
.league-meta { display: flex; flex-wrap: wrap; gap: 6px 22px; color: var(--ice); }
.league-meta b { font-family: var(--f-display); color: var(--c); font-weight: 600; }
.seasons { display: flex; gap: 4px; overflow-x: auto; padding-top: 10px; scrollbar-width: thin; }
.seasons a { flex: none; text-decoration: none; color: var(--muted); font-family: var(--f-display); font-weight: 600; font-size: 15px; letter-spacing: .06em; padding: 10px 16px; border-radius: 10px 10px 0 0; border: 1px solid transparent; border-bottom: 0; }
.seasons a:hover { color: var(--ink); background: rgba(15, 32, 69, .6); }
.seasons a[aria-current="page"] { color: var(--ink); background: var(--bg); border-color: var(--line); box-shadow: inset 0 2px 0 var(--c); }
.body-pad { padding-top: 32px; }

/* Champion banner */
.champ { position: relative; overflow: hidden; border-radius: 18px; padding: 26px; display: grid; gap: 18px; border: 1px solid color-mix(in srgb, var(--gold) 45%, var(--line));
  background: radial-gradient(600px 240px at 0% 0%, rgba(255, 209, 102, .16), transparent 70%), linear-gradient(135deg, var(--surface-2), var(--surface)); }
.champ-top { display: flex; flex-wrap: wrap; align-items: center; gap: 18px; }
.trophy { width: 64px; height: 64px; flex: none; }
.champ .label { font-family: var(--f-display); font-size: 12px; letter-spacing: .22em; text-transform: uppercase; color: var(--gold); }
.champ .who { font-family: var(--f-display); font-size: clamp(30px, 5vw, 46px); font-weight: 700; line-height: 1; text-transform: uppercase; text-shadow: 0 0 26px rgba(255, 209, 102, .35); }
.champ.pending { border-color: var(--line-hi); background: linear-gradient(135deg, var(--surface-2), var(--surface)); }
.champ.pending .label { color: var(--neon); }
.champ.pending .who { color: var(--muted); text-shadow: none; }

/* Scoreboard */
.board { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: center; gap: 12px; background: #020713; border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; }
.board .side { display: grid; gap: 2px; min-width: 0; }
.board .side.r { text-align: right; }
.board .nm { font-family: var(--f-display); font-weight: 600; font-size: 17px; text-transform: uppercase; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.board .sc { font-family: var(--f-num); font-size: 30px; color: var(--muted); line-height: 1.1; }
.board .won .sc { color: var(--neon); text-shadow: 0 0 14px rgba(46, 197, 255, .6); }
.board .won .nm { color: var(--ink); }
.board .vs { font-family: var(--f-display); font-size: 12px; letter-spacing: .2em; color: var(--muted); }
.board.small { padding: 10px 12px; }
.board.small .nm { font-size: 14px; }
.board.small .sc { font-size: 20px; }

/* Tables */
.scroll { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 15px; }
th { text-align: left; font-family: var(--f-display); font-size: 12px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); padding: 8px 10px; border-bottom: 1px solid var(--line-hi); white-space: nowrap; }
td { padding: 9px 10px; border-bottom: 1px solid var(--line); }
tr:last-child td { border-bottom: 0; }
td.n, th.n { text-align: right; font-family: var(--f-num); font-variant-numeric: tabular-nums; white-space: nowrap; }
tbody tr:hover td { background: rgba(46, 197, 255, .05); }
td a { color: var(--ink); text-decoration: none; font-weight: 600; }
td a:hover { color: var(--neon); }
.rk { font-family: var(--f-num); color: var(--muted); width: 2.5em; }
.gold { color: var(--gold); }

/* Roll of champions */
.roll { list-style: none; margin: 0; padding: 0; display: grid; }
.roll li { display: grid; grid-template-columns: 4.2em minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line); }
.roll li:last-child { border-bottom: 0; }
.roll .yr { font-family: var(--f-num); color: var(--neon); }
.roll .ch { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.roll .ch.none { color: var(--muted); font-weight: 400; }
.roll a.more { font-size: 13px; text-decoration: none; font-family: var(--f-display); letter-spacing: .06em; text-transform: uppercase; }

/* Chips & people */
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { display: inline-flex; align-items: center; gap: 8px; padding: 5px 12px 5px 5px; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--line); text-decoration: none; color: var(--ink); font-weight: 500; font-size: 14px; }
.chip:hover { border-color: var(--neon); }
.chip.plain { padding: 5px 12px; }
.badge { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; font-family: var(--f-display); font-weight: 700; font-size: 11px; color: var(--bg); background: linear-gradient(135deg, var(--neon), var(--electric)); flex: none; }
.badge.lg { width: 52px; height: 52px; font-size: 19px; }
.lgtag { --c: var(--neon); display: inline-block; font-family: var(--f-display); font-size: 11px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; padding: 3px 9px; border-radius: 6px; color: var(--c); background: color-mix(in srgb, var(--c) 14%, transparent); border: 1px solid color-mix(in srgb, var(--c) 35%, transparent); text-decoration: none; }

.players { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 14px; }
.pcard { display: grid; gap: 12px; padding: 16px; border-radius: 14px; background: var(--surface); border: 1px solid var(--line); text-decoration: none; color: var(--ink); min-width: 0; transition: border-color .15s, box-shadow .15s; }
.pcard:hover { border-color: var(--neon); box-shadow: var(--glow); }
.pcard .top { display: flex; gap: 12px; align-items: center; min-width: 0; }
.pcard h3 { font-size: 19px; font-weight: 700; text-transform: uppercase; overflow-wrap: anywhere; }
.pcard .line { display: flex; justify-content: space-between; gap: 10px; font-size: 14px; color: var(--muted); }
.pcard .line b { color: var(--ink); font-family: var(--f-num); font-weight: 500; }

.lore { font-size: 17px; line-height: 1.7; max-width: 68ch; color: var(--ice); white-space: pre-wrap; }
.weeks { display: flex; flex-wrap: wrap; gap: 6px; }
.weeks button { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 5px 11px; cursor: pointer; font-family: var(--f-num); font-size: 13px; color: var(--muted); }
.weeks button[aria-pressed="true"] { border-color: var(--neon); color: var(--ink); box-shadow: var(--glow); }
.games { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 10px; }
.awards { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px; }
.award { padding: 14px; border-radius: 12px; background: var(--surface-2); border: 1px solid var(--line); display: grid; gap: 4px; }
.award .t { font-family: var(--f-display); font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--neon); }
.award .w { font-weight: 600; font-size: 17px; }
.award .d { font-size: 14px; color: var(--muted); }

.player-head { display: flex; flex-wrap: wrap; gap: 18px; align-items: center; padding-top: 40px; }
.player-head h1 { font-size: clamp(34px, 6vw, 56px); font-weight: 700; text-transform: uppercase; line-height: 1; }
.totals { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; background: var(--surface); }
.totals div { padding: 14px 16px; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); margin: 0 -1px -1px 0; display: grid; gap: 2px; }
.totals .k { font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
.totals .v { font-family: var(--f-display); font-size: 28px; font-weight: 700; }

footer { border-top: 1px solid var(--line); color: var(--muted); font-size: 13px; }
footer .wrap { padding-block: 22px; display: flex; flex-wrap: wrap; gap: 8px 20px; justify-content: space-between; }

@media (max-width: 560px) {
  .hero .wrap { padding-block: 44px 52px; }
  .champ { padding: 18px; }
  .board .sc { font-size: 24px; }
  .grid-2 { grid-template-columns: 1fr; }
  .games { grid-template-columns: 1fr; }
}
</style>
<style>
/* ===== League pages: animated banners, season picker, all-time, season book ===== */
/* Players pages */
.players-hero, .player-hero { --c: var(--ice); position: relative; overflow: hidden; border-bottom: 1px solid var(--line); background: radial-gradient(900px 300px at 20% 0%, color-mix(in srgb, var(--c) 18%, transparent), transparent 70%), linear-gradient(180deg, #030814, var(--bg)); }
.players-hero .wrap, .player-hero .wrap { position: relative; display: flex; flex-wrap: wrap; align-items: center; gap: 18px 24px; padding-block: 40px; }
.players-hero h1, .player-hero h1 { font-size: clamp(40px, 7vw, 72px); font-weight: 700; line-height: 1; text-transform: uppercase; text-shadow: 0 0 30px color-mix(in srgb, var(--c) 50%, transparent); }
.players-hero p { margin-top: 8px; max-width: 60ch; }
.players-hero .portal-ico { width: 96px; height: 96px; } .players-hero .portal-ico .ico { width: 74px; height: 74px; }
.player-hero .who { display: grid; gap: 8px; min-width: 0; }
/* Big headshot on a player's page, with the photo itself blurred into the header behind it. */
.player-hero .hero-bg { position: absolute; inset: -60px; background-size: cover; background-position: center 25%; filter: blur(40px) saturate(1.4); opacity: .32; }
.player-hero .hero-bg::after { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, rgba(4, 10, 24, .2), rgba(4, 10, 24, .85) 70%); }
.player-hero .wrap { padding-block: 44px; gap: 22px 32px; }
.photo-frame { position: relative; flex: none; width: clamp(150px, 22vw, 230px); aspect-ratio: 1; max-width: 100%; padding: 4px; border-radius: 30px; background: conic-gradient(from var(--ang, 0deg), var(--stops)); animation: orbit 4s linear infinite, float 4s ease-in-out infinite; box-shadow: 0 0 40px color-mix(in srgb, var(--c) 40%, transparent), 0 20px 50px rgba(0, 0, 0, .5); }
.photo-inner { position: relative; width: 100%; height: 100%; overflow: hidden; border-radius: 26px; background: linear-gradient(135deg, var(--neon), var(--electric)); display: grid; place-items: center; }
.photo-inner img { width: 100%; height: 100%; object-fit: cover; display: block; }
.photo-inner .initials { font-family: var(--f-display); font-weight: 700; font-size: clamp(56px, 8vw, 92px); color: var(--bg); }
@media (prefers-reduced-motion: reduce) { .photo-frame { animation: none; } }
.player-hero .share { align-self: start; }
.pf-filter { display: flex; flex-wrap: wrap; gap: 8px; }
.pf-filter button { border: 1px solid var(--line); background: var(--surface); color: var(--muted); border-radius: 999px; padding: 6px 14px; font-family: var(--f-display); font-weight: 600; font-size: 13px; letter-spacing: .08em; text-transform: uppercase; cursor: pointer; transition: all .2s; }
.pf-filter button:hover { color: var(--ink); border-color: var(--c); }
.pf-filter button[aria-pressed="true"] { color: var(--bg); background: var(--c); border-color: var(--c); box-shadow: 0 0 16px color-mix(in srgb, var(--c) 55%, transparent); }
.pcard2 { position: relative; overflow: hidden; display: grid; justify-items: center; align-content: start; text-align: center; gap: 12px; padding: 24px 16px 18px; border-radius: 18px; text-decoration: none; color: var(--ink); background: linear-gradient(180deg, var(--surface-2), var(--surface)); border: 1px solid var(--line); min-width: 0; transition: transform .2s, border-color .2s, box-shadow .2s; animation: rise .5s both; }
.pcard2:hover { transform: translateY(-5px); border-color: var(--neon); box-shadow: 0 12px 36px rgba(46, 197, 255, .2); }
.pcard2 h3 { font-size: 20px; font-weight: 700; text-transform: uppercase; overflow-wrap: anywhere; }
.pcard2 .chips { justify-content: center; }
.pcard2 .go-p { font-family: var(--f-display); font-size: 13px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--neon); opacity: .65; transition: opacity .2s, transform .2s; }
.pcard2:hover .go-p { opacity: 1; transform: translateX(3px); }
.shine-sweep { position: absolute; inset: 0; background: linear-gradient(100deg, transparent 35%, rgba(255, 255, 255, .08) 50%, transparent 65%); transform: translateX(-100%); animation: scan 6s ease-in-out infinite; pointer-events: none; }
.ring-av { display: inline-grid; place-items: center; padding: 3px; border-radius: 50%; flex: none; background: conic-gradient(from var(--ang, 0deg), var(--stops)); animation: orbit 3.5s linear infinite; box-shadow: 0 0 24px rgba(46, 197, 255, .25); }
.ring-av .av { border: 3px solid var(--bg); }
.ring-av .av.xl { width: 110px; height: 110px; font-size: 36px; }
.pcard2 .ring-av .av.lg { width: 92px; height: 92px; font-size: 30px; }
/* 7 tiles on a 5-column grid: trophies and points for take two columns, so both rows fill. */
.stat-tiles { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 12px; }
.stat-tiles .tile.gold, .stat-tiles .tile.silver, .stat-tiles .tile:last-child { grid-column: span 2; }
@media (max-width: 640px) {
  .stat-tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .stat-tiles .tile.gold, .stat-tiles .tile.silver { grid-column: auto; }
}
.tile { position: relative; overflow: hidden; display: grid; gap: 4px; align-content: end; min-height: 96px; padding: 16px; border-radius: 14px; background: rgba(10, 23, 51, .85); border: 1px solid var(--line); animation: rise .5s both; }
.tile .k { font-size: 11px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); padding-right: 40px; }
.tile .v { font-family: var(--f-display); font-size: 32px; font-weight: 700; line-height: 1.05; }
.tile.gold { border-color: rgba(255, 209, 102, .45); background: radial-gradient(240px 120px at 100% 0%, rgba(255, 209, 102, .16), transparent 70%), rgba(10, 23, 51, .85); }
.tile.gold .v { color: var(--gold); text-shadow: 0 0 14px rgba(255, 209, 102, .4); }
.tile.silver { border-color: rgba(214, 222, 232, .35); }
.tile.silver .v { color: #E3EAF3; }
.tile-ico { position: absolute; right: 10px; top: 10px; width: 38px; height: 38px; }
.league-block { display: grid; gap: 16px; padding: 20px; border-radius: 18px; border: 1px solid color-mix(in srgb, var(--c) 40%, var(--line)); background: linear-gradient(160deg, color-mix(in srgb, var(--c) 10%, var(--surface)), var(--surface) 60%); animation: rise .5s both; }
.lb-head { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 16px; }
.lb-head h2 { font-size: 24px; text-transform: uppercase; color: var(--c); }
.lb-head .lgtag { margin-left: auto; }
.portal-ico.small { width: 54px; height: 54px; border-radius: 14px; } .portal-ico.small .ico { width: 40px; height: 40px; }
@media (prefers-reduced-motion: reduce) { .pcard2, .shine-sweep, .ring-av, .tile, .league-block { animation: none !important; } }

/* Playoff bracket */
.bracket-wrap { overflow-x: auto; padding-bottom: 6px; border: 1px solid var(--line); border-radius: 16px; background: radial-gradient(700px 260px at 100% 50%, rgba(255, 209, 102, .08), transparent 70%), rgba(10, 23, 51, .6); }
.bracket { display: grid; gap: 36px; padding: 18px; min-width: 760px; }
.bracket.cols-4 { grid-template-columns: repeat(3, minmax(190px, 1fr)) minmax(170px, .8fr); }
.bracket.cols-3 { grid-template-columns: repeat(2, minmax(200px, 1fr)) minmax(170px, .8fr); min-width: 600px; }
/* Each column is its heading over a body; bodies share a height, so a lone card (the final, the champion) sits midway between the two semifinals. */
.bk-col { display: grid; grid-template-rows: auto 1fr; gap: 14px; position: relative; }
.bk-body { display: flex; flex-direction: column; justify-content: space-around; gap: 14px; }
.bk-h { font-family: var(--f-display); font-size: 12px; font-weight: 600; letter-spacing: .18em; text-transform: uppercase; color: var(--c, var(--neon)); margin-bottom: 2px; }
.bk-match { position: relative; border: 1px solid var(--line); border-radius: 12px; background: #030916; overflow: visible; animation: rise .45s both; }
.bk-match.done { border-color: color-mix(in srgb, var(--c, var(--neon)) 45%, var(--line)); }
.bk-col:not(.bk-champ) .bk-match::after { content: ""; position: absolute; top: 50%; right: -37px; width: 36px; height: 2px; background: linear-gradient(90deg, color-mix(in srgb, var(--c, var(--neon)) 70%, transparent), transparent); background-size: 200% 100%; animation: flow 1.8s linear infinite; }
@keyframes flow { from { background-position: 100% 0; } to { background-position: -100% 0; } }
.bk-team { display: grid; grid-template-columns: 18px 28px minmax(0, 1fr) auto; align-items: center; gap: 8px; padding: 8px 10px; }
.bk-team + .bk-team { border-top: 1px solid var(--line); }
.bk-team .av { width: 28px; height: 28px; font-size: 11px; }
.bk-team .av.tbd, .bk-crown .av.tbd { background: var(--surface-2); color: var(--muted); border-style: dashed; }
.bk-team .seed { font-family: var(--f-num); font-size: 12px; color: var(--muted); text-align: center; }
.bk-team .nm { font-weight: 600; font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bk-team.tbd .nm { color: var(--muted); font-weight: 400; font-style: italic; }
.bk-team .sc { font-size: 15px; color: var(--muted); }
.bk-team.win { background: linear-gradient(90deg, color-mix(in srgb, var(--c, var(--neon)) 16%, transparent), transparent); }
.bk-team.win .nm { color: var(--ink); }
.bk-team.win .sc { color: var(--neon); text-shadow: 0 0 10px rgba(46, 197, 255, .6); }
.bk-team.lose { opacity: .55; }
.bk-wk { position: absolute; top: -9px; right: 10px; font-family: var(--f-num); font-size: 10px; color: var(--muted); background: var(--bg); padding: 0 6px; border-radius: 6px; }
.bk-byes { display: grid; gap: 8px; }
.bk-bye { display: grid; grid-template-columns: 28px minmax(0, 1fr) auto; align-items: center; gap: 8px; padding: 7px 10px; border-radius: 10px; border: 1px dashed var(--line-hi); font-size: 13px; color: var(--ice); }
.bk-bye .av { width: 28px; height: 28px; font-size: 11px; }
.bk-bye span:nth-child(2) { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bk-bye .tag { font-family: var(--f-display); font-size: 10px; letter-spacing: .14em; text-transform: uppercase; color: var(--gold); border: 1px solid rgba(255, 209, 102, .45); border-radius: 6px; padding: 1px 6px; }
.bk-crown { display: grid; justify-items: center; gap: 8px; padding: 18px 12px; border-radius: 16px; text-align: center; border: 1px solid rgba(255, 209, 102, .5); background: radial-gradient(circle at 50% 20%, rgba(255, 209, 102, .2), transparent 70%), #030916; box-shadow: 0 0 30px rgba(255, 209, 102, .15); animation: rise .5s both; animation-delay: .5s; }
.bk-crown.pending { border-color: var(--line-hi); background: #030916; box-shadow: none; }
.bk-crown .bk-tro { width: 56px; height: 56px; }
.bk-crown .nm { font-family: var(--f-display); font-weight: 700; font-size: 18px; text-transform: uppercase; line-height: 1.1; overflow-wrap: anywhere; }
.bk-crown:not(.pending) .nm { background: linear-gradient(100deg, #E0A93A, #FFE7A3 40%, #fff 50%, #FFD166 60%, #E0A93A); background-size: 250% 100%; -webkit-background-clip: text; background-clip: text; color: transparent; animation: gold-sheen 4s linear infinite; }
.bk-crown.pending .nm { color: var(--muted); }
@media (prefers-reduced-motion: reduce) { .bk-match, .bk-crown, .bk-crown .nm, .bk-col .bk-match::after { animation: none !important; } }

/* Co-managed team: overlapping headshots, both names. Season note strip. */
.mgr.co .av + .av { margin-left: -14px; box-shadow: -2px 0 0 var(--bg); }
.mgr.co a { color: inherit; text-decoration: none; }
.mgr.co a:hover { color: var(--neon); }
.season-note { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-radius: 12px; border: 1px solid color-mix(in srgb, var(--c, var(--neon)) 40%, var(--line)); background: color-mix(in srgb, var(--c, var(--neon)) 8%, var(--surface)); color: var(--ice); font-size: 14px; animation: rise .4s both; }
.season-note::before { content: "i"; flex: none; width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; font-family: var(--f-display); font-weight: 700; font-size: 13px; color: var(--bg); background: var(--c, var(--neon)); }

/* Spiral football beside the logo: laces roll over the ball, so it reads as a tight spiral. */
.nav-ball { width: 52px; height: 22px; flex: none; overflow: visible; filter: drop-shadow(0 0 6px rgba(46, 197, 255, .45)); }
.nav-ball .body { animation: float 1.6s ease-in-out infinite; }
.nav-ball .laces { animation: spiral .6s linear infinite; }
.nav-ball .l2 { animation-delay: -.3s; }
.nav-ball .sheen { animation: spiral .6s linear infinite; animation-delay: -.15s; }
.nav-ball .trail path { animation: trail .6s linear infinite; }
.nav-ball .trail path:nth-child(2) { animation-delay: -.2s; } .nav-ball .trail path:nth-child(3) { animation-delay: -.4s; }
@keyframes spiral { 0% { transform: translateY(-15px); } 100% { transform: translateY(15px); } }
@keyframes float { 50% { transform: translateY(-2px); } }
@keyframes trail { 0% { transform: translateX(8px); opacity: 0; } 30% { opacity: .9; } 100% { transform: translateX(-6px); opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .nav-ball * { animation: none !important; } .banner::before { animation: none; } }

/* Title sits above the animation; the stage below it always shows the whole scene (see fitScenes). */
.banner { --c: var(--neon); position: relative; overflow: hidden; border-bottom: 1px solid var(--line);
  background: radial-gradient(1100px 340px at 50% 110%, color-mix(in srgb, var(--c) 30%, transparent), transparent 70%), linear-gradient(180deg, #030814, color-mix(in srgb, var(--c) 10%, var(--bg))); }
.banner::before { content: ""; position: absolute; inset: 0; background-image: linear-gradient(color-mix(in srgb, var(--c) 10%, transparent) 1px, transparent 1px), linear-gradient(90deg, color-mix(in srgb, var(--c) 7%, transparent) 1px, transparent 1px); background-size: 44px 44px; mask-image: linear-gradient(180deg, #000, transparent 70%); -webkit-mask-image: linear-gradient(180deg, #000, transparent 70%); animation: grid-drift 12s linear infinite; pointer-events: none; }
@keyframes grid-drift { to { background-position: 44px 44px, 44px 44px; } }
.banner .stage { position: relative; height: clamp(190px, 27vw, 340px); margin-top: -6px; }
.banner.short .stage { height: clamp(160px, 19vw, 240px); }
.banner .scene { position: absolute; inset: 0; width: 100%; height: 100%; color: var(--c); }
.banner .wrap { position: relative; z-index: 1; padding-block: 24px 0; display: grid; gap: 8px; }
.banner h1 { font-size: clamp(32px, 6vw, 64px); font-weight: 700; line-height: .98; text-transform: uppercase; text-shadow: 0 0 30px color-mix(in srgb, var(--c) 70%, transparent), 0 2px 10px rgba(0, 0, 0, .8); }
.banner .sub { color: var(--ice); display: flex; flex-wrap: wrap; gap: 4px 18px; text-shadow: 0 1px 8px rgba(0, 0, 0, .9); }
.banner .sub b { font-family: var(--f-display); color: var(--c); }
.typetag { display: inline-flex; align-items: center; gap: 6px; font-family: var(--f-display); font-size: 12px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; padding: 3px 10px; border-radius: 999px; color: var(--c); border: 1px solid color-mix(in srgb, var(--c) 50%, transparent); background: rgba(3, 8, 20, .6); }

/* Animated trophies (gold, silver, and the dim "not decided yet" one all shine and sparkle) */
.trophy-anim { overflow: visible; filter: drop-shadow(0 0 8px rgba(255, 209, 102, .35)); }
.trophy-anim .shine { animation: shine 3.2s ease-in-out infinite; }
.trophy-anim .sparkle { transform-box: fill-box; transform-origin: center; animation: sparkle 3.2s ease-in-out infinite; }
.trophy-anim .s2 { animation-delay: 1.6s; }
.pick-card .tro, .plaque .tro { animation: bob 3s ease-in-out infinite; }
@keyframes bob { 50% { transform: translateY(-3px); } }

/* Season picker */
.picker { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 14px; }
.pick-card { --c: var(--neon); position: relative; display: grid; gap: 10px; align-content: start; padding: 18px; border-radius: 16px; text-decoration: none; color: var(--ink); background: linear-gradient(160deg, color-mix(in srgb, var(--c) 12%, var(--surface)), var(--surface) 60%); border: 1px solid color-mix(in srgb, var(--c) 30%, var(--line)); overflow: hidden; min-width: 0; transition: transform .2s, box-shadow .2s, border-color .2s; animation: rise .5s both; }
.pick-card:hover { transform: translateY(-4px); border-color: var(--c); box-shadow: 0 0 0 1px var(--c), 0 12px 36px color-mix(in srgb, var(--c) 30%, transparent); }
.pick-card .yr { font-family: var(--f-display); font-size: 44px; font-weight: 700; line-height: 1; letter-spacing: .02em; }
.pick-card .who { display: flex; align-items: center; gap: 10px; min-width: 0; font-weight: 600; }
.pick-card .who span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pick-card .tro { width: 30px; height: 30px; flex: none; }
.pick-card .note { font-size: 13px; color: var(--muted); }
.pick-card.alltime { grid-column: 1 / -1; padding: 24px; background: linear-gradient(120deg, color-mix(in srgb, var(--c) 22%, var(--surface)), var(--surface) 70%); }
.pick-card.alltime .yr { font-size: clamp(40px, 7vw, 64px); }
.pick-card.alltime::before { content: ""; position: absolute; inset: -2px; border-radius: 18px; padding: 2px; background: conic-gradient(from var(--ang, 0deg), transparent 0 70%, var(--c) 85%, transparent 100%); -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor; mask-composite: exclude; animation: orbit 4s linear infinite; pointer-events: none; }
@property --ang { syntax: "<angle>"; initial-value: 0deg; inherits: false; }
@keyframes orbit { to { --ang: 360deg; } }
.pick-card .scan { position: absolute; inset: 0; background: linear-gradient(100deg, transparent 35%, rgba(255, 255, 255, .07) 50%, transparent 65%); transform: translateX(-100%); animation: scan 5s ease-in-out infinite; pointer-events: none; }
@keyframes scan { 0%, 60% { transform: translateX(-100%); } 100% { transform: translateX(100%); } }
@keyframes rise { from { opacity: .55; transform: translateY(10px); } to { opacity: 1; transform: none; } }
.live-dot { display: inline-flex; align-items: center; gap: 6px; color: var(--win); font-size: 12px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; }
.live-dot::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--win); box-shadow: 0 0 10px var(--win); animation: pulse 1.4s ease-in-out infinite; }
@keyframes pulse { 50% { transform: scale(1.6); opacity: .5; } }

/* Season switcher chips */
.switcher { display: flex; gap: 6px; overflow-x: auto; padding-block: 4px; scrollbar-width: thin; }
.switcher a { flex: none; text-decoration: none; color: var(--muted); font-family: var(--f-display); font-weight: 600; font-size: 14px; letter-spacing: .06em; padding: 6px 12px; border-radius: 8px; border: 1px solid var(--line); background: rgba(10, 23, 51, .7); }
.switcher a:hover { color: var(--ink); border-color: var(--c, var(--neon)); }
.switcher a[aria-current="page"] { color: var(--bg); background: var(--c, var(--neon)); border-color: var(--c, var(--neon)); box-shadow: 0 0 16px color-mix(in srgb, var(--c, var(--neon)) 50%, transparent); }

/* Avatars */
.av { width: 36px; height: 36px; border-radius: 50%; flex: none; object-fit: cover; display: grid; place-items: center; font-family: var(--f-display); font-weight: 700; font-size: 13px; color: var(--bg); background: linear-gradient(135deg, var(--neon), var(--electric)); border: 2px solid rgba(230, 241, 255, .25); }
.av.xl { width: 84px; height: 84px; font-size: 28px; border-width: 3px; }
.av.lg { width: 56px; height: 56px; font-size: 19px; }
.mgr { display: inline-flex; align-items: center; gap: 10px; min-width: 0; color: var(--ink); text-decoration: none; font-weight: 600; }
.mgr:hover { color: var(--neon); }
.mgr span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* Champion hero (season) */
.crown-hero { position: relative; overflow: hidden; border-radius: 20px; padding: 26px; display: grid; gap: 18px; border: 1px solid color-mix(in srgb, var(--gold) 50%, var(--line));
  background: radial-gradient(700px 260px at 10% 0%, rgba(255, 209, 102, .18), transparent 70%), linear-gradient(135deg, var(--surface-2), var(--surface)); animation: rise .5s both; }
.crown-hero.pending { border-color: var(--line-hi); background: radial-gradient(700px 260px at 10% 0%, color-mix(in srgb, var(--c) 14%, transparent), transparent 70%), linear-gradient(135deg, var(--surface-2), var(--surface)); }
.crown-hero .top { display: flex; flex-wrap: wrap; align-items: center; gap: 18px 22px; }
.crown-hero .big-tro { width: 96px; height: 96px; flex: none; }
.crown-hero .label { font-family: var(--f-display); font-size: 13px; letter-spacing: .22em; text-transform: uppercase; color: var(--gold); }
.crown-hero.pending .label { color: var(--c); }
.crown-hero .name { font-family: var(--f-display); font-size: clamp(34px, 6vw, 58px); font-weight: 700; line-height: 1; text-transform: uppercase;
  background: linear-gradient(100deg, #E0A93A 0%, #FFE7A3 30%, #fff 45%, #FFD166 60%, #E0A93A 100%); background-size: 250% 100%; -webkit-background-clip: text; background-clip: text; color: transparent; animation: gold-sheen 4s linear infinite; }
.crown-hero .name a { color: inherit; text-decoration: none; }
.crown-hero.pending .name { background: linear-gradient(100deg, var(--muted), var(--ice), var(--muted)); background-size: 250% 100%; -webkit-background-clip: text; background-clip: text; }
@keyframes gold-sheen { to { background-position: -250% 0; } }
.confetti { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
.confetti i { position: absolute; top: -10px; width: 6px; height: 10px; border-radius: 2px; opacity: .8; animation: fall linear infinite; }
@keyframes fall { to { transform: translateY(340px) rotate(540deg); opacity: 0; } }

/* Section shells */
.book { display: grid; gap: 28px; padding-top: 28px; }
.sec-title { display: flex; align-items: center; gap: 10px; font-size: 22px; font-weight: 700; text-transform: uppercase; }
.sec-title::before { content: ""; width: 10px; height: 10px; border-radius: 2px; background: var(--c, var(--neon)); box-shadow: 0 0 12px var(--c, var(--neon)); transform: rotate(45deg); animation: pulse 2.4s ease-in-out infinite; }
.tablewrap { overflow-x: auto; overflow-y: hidden; border: 1px solid var(--line); border-radius: 14px; background: rgba(10, 23, 51, .78); }
.tablewrap table { min-width: 640px; }
.tablewrap tbody tr { animation: rise .45s both; }

<script src="config.js"></script>
<script>
/*
  BAM Fantasy reads all of its stats from the tabs of the Google Sheet (or the CSV files in
  the data folder): Leagues, Managers, Members, Seasons, Standings, Games, Lineups, Draft,
  Trades, Awards. See README.md for what goes in each one.
*/
const TABS = ["Leagues", "Managers", "Members", "Seasons", "Standings", "Games", "Lineups", "Draft", "Trades", "Awards"];
const REQUIRED = new Set(["Leagues", "Managers", "Seasons"]);
const COLORS = ["#2EC5FF", "#8B8BFF", "#4D8DFF", "#3DF5D0", "#B07BFF", "#5FD3FF"];
const REDUCED = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;

let D = { managers: [], leagues: [] }, M = {}, L = {};
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const slug = s => String(s || "").toLowerCase().normalize("NFD").replace(/[Ì€-Í¯]/g, "").replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "");
const nm = id => (M[id] && M[id].name) || id || "â€”";
const initials = n => String(n).split(/\s+/).filter(Boolean).slice(0, 2).map(w => w[0]).join("").toUpperCase();
const pts = n => (n == null ? "â€”" : Number(n).toLocaleString(undefined, { minimumFractionDigits: 1, maximumFractionDigits: 2 }));
const rec = (w, l, t) => `${w || 0}-${l || 0}${t ? "-" + t : ""}`;
const wpct = s => (s.w + s.t / 2) / Math.max(1, s.w + s.l + s.t);
const pct = s => (s.w + s.l + s.t) ? (wpct(s) * 100).toFixed(1) + "%" : "â€”";
const ordinal = n => { const s = ["th", "st", "nd", "rd"], v = n % 100; return n + (s[(v - 20) % 10] || s[v] || s[0]); };
const latestSeason = lg => lg.seasons[lg.seasons.length - 1];
const lastChamp = lg => [...lg.seasons].reverse().find(s => s.champion);
const yearSpan = lg => { const y = lg.seasons.map(s => s.year); return y.length ? (y[0] === y[y.length - 1] ? `${y[0]}` : `${y[0]}â€“${y[y.length - 1]}`) : "â€”"; };
const BASE = location.pathname.replace(/index\.html$/, "").replace(/[^/]*$/, "");
const go = r => `href="${BASE}${r === "home" ? "" : r}" data-r="${r}"`;
const plink = id => M[id] ? `<a ${go("players/" + id)}>${esc(nm(id))}</a>` : esc(nm(id));
const lgtag = lg => `<a class="lgtag" style="--c:${lg.color}" ${go(lg.id)}>${esc(lg.short)}</a>`;
// Bump IMG_VERSION whenever the photos in the images folder are replaced, so browsers load the new ones.
const IMG_VERSION = "2026-10-29c";
const imgUrl = u => !u ? "" : /^(https?:)?\/\//i.test(u) || u.startsWith("data:") ? u : BASE + u.replace(/^\.?\//, "") + "?v=" + IMG_VERSION;
function av(id, size) {
  const m = M[id], cls = "av" + (size ? " " + size : "");
  if (m && m.photo) return `<img class="${cls}" src="${esc(imgUrl(m.photo))}" alt="" loading="lazy">`;
  return `<span class="${cls}" aria-hidden="true">${esc(initials(nm(id)))}</span>`;
}
const mgr = (id, size) => id ? `<a class="mgr" ${go("players/" + id)}>${av(id, size)}<span>${esc(nm(id))}</span></a>` : `<span class="muted">â€”</span>`;

/* ---------- loading the data ---------- */
function parseCSV(text) {
  const rows = []; let row = [], f = "", q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) {
      if (c === '"') { if (text[i + 1] === '"') { f += '"'; i++; } else q = false; }
      else f += c;
    } else if (c === '"') q = true;
    else if (c === ",") { row.push(f); f = ""; }
    else if (c === "\n") { row.push(f); rows.push(row); row = []; f = ""; }
    else if (c !== "\r") f += c;
  }
  if (f !== "" || row.length) { row.push(f); rows.push(row); }
  const head = (rows.shift() || []).map(h => h.toLowerCase().replace(/[^a-z0-9]/g, ""));
  return rows
    .filter(r => r.some(v => v.trim() !== ""))
    .map(r => Object.fromEntries(head.map((h, i) => [h, (r[i] || "").trim()])));
}

async function fetchTab(tab) {
  const id = (window.BAM_CONFIG && window.BAM_CONFIG.sheetId || "").trim();
  const url = id
    ? `https://docs.google.com/spreadsheets/d/${encodeURIComponent(id)}/gviz/tq?tqx=out:csv&headers=1&sheet=${encodeURIComponent(tab)}`
    : `${BASE}data/${tab}.csv?v=${Date.now()}`;
  try {
    const res = await fetch(url, { cache: "no-store" });
    if (!res.ok) throw new Error(`${tab}: HTTP ${res.status}`);
    const text = await res.text();
    if (/^\s*</.test(text)) throw new Error(`${tab}: the sheet isn't shared publicly`);
    return parseCSV(text);
  } catch (err) {
    if (REQUIRED.has(tab)) throw err;
    console.warn(`BAM Fantasy: couldn't read the ${tab} tab, so it's treated as empty.`, err.message);
    return [];
  }
}

const numOrNull = v => { if (v == null || v === "") return null; const n = parseFloat(String(v).replace(/,/g, "")); return isFinite(n) ? n : null; };
const int0 = v => Math.round(numOrNull(v) || 0);
const yesNo = v => /^(y|yes|true|x|1)$/i.test(v || "") ? true : /^(n|no|false|0)$/i.test(v || "") ? false : null;
const isPlayoffRound = r => !!r && !/regular|consol|toilet|sacko|3rd|third|5th|fifth|7th|9th|place/i.test(r);
const SLOT_ORDER = ["QB", "RB", "WR", "TE", "FLEX", "WRT", "W/R/T", "SUPERFLEX", "SFLX", "OP", "K", "DST", "DEF", "D/ST", "IDP"];
const isBench = s => /^(bn|bench|ir|taxi|res)/i.test(s || "");

function build(t) {
  const managers = new Map();
  const addManager = (name, extra) => {
    name = String(name || "").trim();
    if (!name) return null;
    const id = slug(name);
    if (!managers.has(id)) managers.set(id, { id, name, nickname: "", photo: "" });
    if (extra) Object.entries(extra).forEach(([k, v]) => { if (v) managers.get(id)[k] = v; });
    return id;
  };
  const known = new Set(t.Managers.map(m => slug(m.name)));
  const one = name => {
    const id = addManager(name);
    if (id && !known.has(id)) { known.add(id); console.warn(`BAM Fantasy: "${name}" isn't on the Managers tab (check the spelling).`); }
    return id;
  };
  // A team run by two people is written "Tristan & Juan" (or with +). The first name stands for the
  // team; season.co remembers everyone on it, so each of them gets credit for the team's results.
  const who = (name, s) => {
    const ids = String(name || "").split(/\s*[&+]\s*/).map(one).filter(Boolean);
    if (s && ids.length > 1) s.co[ids[0]] = ids;
    return ids[0] || null;
  };
  t.Managers.forEach(m => addManager(m.name, { nickname: m.nickname, photo: m.photo || m.headshot || m.image }));

  const leagues = t.Leagues.map((r, i) => ({
    id: slug(r.shortname || r.league || r.name),
    name: r.league || r.name || r.shortname,
    short: r.shortname || r.league || r.name,
    founded: numOrNull(r.founded),
    color: /^#[0-9a-f]{3,8}$/i.test(r.color) ? r.color : COLORS[i % COLORS.length],
    order: numOrNull(r.order) ?? i + 1,
    type: /dyn/i.test(r.type) ? "Dynasty" : /keep/i.test(r.type) ? "Keeper" : "Redraft",
    weeks: numOrNull(r.weeks) || 17,
    playoffTeams: [4, 6, 8].includes(numOrNull(r.playoffteams)) ? numOrNull(r.playoffteams) : 6,
    members: [], seasons: []
  })).filter(l => l.id).sort((a, b) => a.order - b.order);
  const lgFor = name => { const s = slug(name); return leagues.find(l => l.id === s || slug(l.name) === s); };
  const season = (lgName, year) => {
    const lg = lgFor(lgName), y = int0(year);
    if (!lg || !y) return null;
    let s = lg.seasons.find(x => x.year === y);
    if (!s) { s = { year: y, status: "complete", standings: [], games: [], lineups: {}, draft: [], trades: [], awards: [], co: {} }; lg.seasons.push(s); }
    return s;
  };

  for (const r of t.Members) { const lg = lgFor(r.league), id = who(r.manager); if (lg && id && !lg.members.includes(id)) lg.members.push(id); }
  for (const r of t.Seasons) {
    const s = season(r.league, r.year); if (!s) continue;
    s.status = /progress|live|current|active/i.test(r.status) ? "in-progress" : "complete";
    s.teams = numOrNull(r.teams);
    s.weeks = numOrNull(r.weeks);
    s.note = r.note || "";
    s.champion = who(r.champion, s);
    s.runnerUp = who(r.runnerup, s);
    s.lore = r.lore || "";
    const cs = numOrNull(r.championscore), rs = numOrNull(r.runnerupscore);
    if (s.champion && s.runnerUp && (cs != null || rs != null)) s.championship = { week: numOrNull(r.championshipweek), winner: { id: s.champion, score: cs }, loser: { id: s.runnerUp, score: rs } };
  }
  for (const r of t.Standings) {
    const s = season(r.league, r.year), id = who(r.manager, s); if (!s || !id) continue;
    // A roster row with no wins, losses or ties yet means "played this season, record not added yet".
    const hasRec = [r.wins, r.losses, r.ties].some(v => v !== "" && v != null);
    s.standings.push({ id, hasRec, w: int0(r.wins), l: int0(r.losses), t: int0(r.ties), pf: numOrNull(r.pointsfor), pa: numOrNull(r.pointsagainst), rank: numOrNull(r.rank), finish: numOrNull(r.finish), seed: numOrNull(r.seed), madePlayoffs: yesNo(r.madeplayoffs), playoffWins: numOrNull(r.playoffwins) });
  }
  for (const r of t.Games) {
    const s = season(r.league, r.year), wk = int0(r.week); if (!s || !wk) continue;
    s.games.push({ week: wk, round: r.round || "", home: who(r.team1, s), homeScore: numOrNull(r.team1score), away: who(r.team2, s), awayScore: numOrNull(r.team2score) });
  }
  for (const r of t.Lineups) {
    const s = season(r.league, r.year), wk = int0(r.week), id = s && who(r.manager, s); if (!s || !wk || !id || !r.player) continue;
    (s.lineups[wk + "|" + id] ||= []).push({ slot: (r.slot || "").toUpperCase(), player: r.player, pos: (r.position || "").toUpperCase(), nfl: (r.nflteam || "").toUpperCase(), pts: numOrNull(r.points) });
  }
  for (const r of t.Draft) {
    const s = season(r.league, r.year); if (!s || !r.player) continue;
    s.draft.push({ round: numOrNull(r.round), pick: numOrNull(r.pick), id: who(r.manager, s), player: r.player, pos: (r.position || "").toUpperCase(), nfl: (r.nflteam || "").toUpperCase() });
  }
  const items = v => String(v || "").split(/[;\n,]/).map(x => x.trim()).filter(Boolean);
  for (const r of t.Trades) {
    const s = season(r.league, r.year); if (!s || !(r.manager1 && r.manager2)) continue;
    s.trades.push({ week: numOrNull(r.week), date: r.date, a: who(r.manager1, s), aGets: items(r.manager1gets), b: who(r.manager2, s), bGets: items(r.manager2gets), note: r.note });
  }
  for (const r of t.Awards) {
    const s = season(r.league, r.year); if (!s || !r.award) continue;
    s.awards.push({ title: r.award, id: who(r.manager, s), note: r.note });
  }
  for (const lg of leagues) {
    lg.seasons.sort((a, b) => a.year - b.year);
    for (const s of lg.seasons) {
      s.draft.sort((a, b) => (a.round || 99) - (b.round || 99) || (a.pick || 99) - (b.pick || 99));
      s.trades.sort((a, b) => (a.week || 99) - (b.week || 99));
    }
    if (!lg.founded && lg.seasons.length) lg.founded = lg.seasons[0].year;
    if (!lg.seasons.length) lg.seasons.push({ year: new Date().getFullYear(), status: "in-progress", standings: [], games: [], lineups: {}, draft: [], trades: [], awards: [], co: {} });
  }
  D = { managers: [...managers.values()].sort((a, b) => a.name.localeCompare(b.name)), leagues };
  M = Object.fromEntries(D.managers.map(m => [m.id, m]));
  L = Object.fromEntries(D.leagues.map(l => [l.id, l]));
}

/* ---------- stats ---------- */
const winnerOf = g => g.homeScore == null || g.awayScore == null || g.homeScore === g.awayScore ? null : g.homeScore > g.awayScore ? g.home : g.away;
// Everyone on a team that season (two people for a co-managed team), and how to show its name.
const teamIds = (s, id) => (id && s.co && s.co[id]) || (id ? [id] : []);
const onTeam = (s, teamId, id) => teamIds(s, teamId).includes(id);
const teamName = (s, id) => teamIds(s, id).map(nm).join(" & ") || "â€”";
const teamLink = (s, id) => teamIds(s, id).map(plink).join(" &amp; ") || "â€”";
const mgrTeam = (s, id, size) => {
  const ids = teamIds(s, id);
  if (ids.length < 2) return mgr(id, size);
  return `<span class="mgr co">${ids.map(x => av(x, size)).join("")}<span>${ids.map(x => `<a ${go("players/" + x)}>${esc(nm(x))}</a>`).join(" &amp; ")}</span></span>`;
};
function seasonRow(s, id) {
  const r = s.standings.find(x => onTeam(s, x.id, id));
  const po = s.games.filter(g => isPlayoffRound(g.round) && (onTeam(s, g.home, id) || onTeam(s, g.away, id)));
  const finalist = onTeam(s, s.champion, id) || onTeam(s, s.runnerUp, id);
  const madePlayoffs = r && r.madePlayoffs != null ? r.madePlayoffs : (po.length > 0 || finalist || !!(r && r.seed));
  const playoffWins = r && r.playoffWins != null ? r.playoffWins : po.filter(g => onTeam(s, winnerOf(g), id)).length;
  return { r, madePlayoffs, playoffWins, finalist };
}
function leagueStats(lg, id) {
  const s = { id, w: 0, l: 0, t: 0, pf: 0, pa: 0, seasons: 0, played: 0, titles: 0, finals: 0, poWins: 0, poApps: 0 };
  for (const se of lg.seasons) {
    const x = seasonRow(se, id);
    if (x.r) s.played++;
    if (x.r && x.r.hasRec) { s.w += x.r.w; s.l += x.r.l; s.t += x.r.t; s.pf += x.r.pf || 0; s.pa += x.r.pa || 0; s.seasons++; }
    if (onTeam(se, se.champion, id)) s.titles++;
    if (x.finalist) s.finals++;
    if (x.madePlayoffs) s.poApps++;
    s.poWins += x.playoffWins || 0;
  }
  return s;
}
function leagueRoster(lg) {
  const ids = new Set(lg.members);
  for (const s of lg.seasons) {
    s.standings.forEach(r => teamIds(s, r.id).forEach(x => ids.add(x)));
    teamIds(s, s.champion).forEach(x => ids.add(x)); teamIds(s, s.runnerUp).forEach(x => ids.add(x));
  }
  return [...ids].filter(Boolean);
}
function playerLeagues(id) { return D.leagues.filter(lg => leagueRoster(lg).includes(id)); }
function playerTotals(id) {
  const t = { w: 0, l: 0, t: 0, pf: 0, pa: 0, seasons: 0, titles: 0, finals: 0, poWins: 0, poApps: 0 };
  for (const lg of D.leagues) { const s = leagueStats(lg, id); for (const k in t) t[k] += s[k]; }
  return t;
}

/* ---------- routing: every page has its own address ----------
   /                        hub
   /gridiron                pick a season (all time or a year)
   /gridiron/all-time       champions wall + all-time standings
   /gridiron/2025           a season: champion, standings, weeks
   /gridiron/2025/draft     â€¦/trades  â€¦/lore
   /players  /players/john-lee                                      */
const SEASON_TABS = [["weeks", "Weeks"], ["draft", "Draft"], ["trades", "Trades"], ["lore", "Lore"]];
function findLeague(s) { return L[s] || D.leagues.find(l => slug(l.name) === s); }
function parse(r) {
  const p = String(r || "").toLowerCase().split("/").filter(Boolean);
  if (!p.length || p[0] === "home") return { v: "home" };
  if (p[0] === "players") return p[1] && M[p[1]] ? { v: "player", id: p[1] } : { v: "players" };
  if (p.length === 1 && p[0].startsWith("player-") && M[p[0].slice(7)]) return { v: "player", id: p[0].slice(7) };
  let key = p[0], sub = p[1], tab = p[2];
  const old = p.length === 1 && p[0].match(/^(.+)-(\d{4})$/);
  if (old && !findLeague(p[0]) && findLeague(old[1])) { key = old[1]; sub = old[2]; }
  const lg = findLeague(key);
  if (!lg) return { v: "home" };
  if (sub === "all-time" || sub === "alltime") return { v: "alltime", lg };
  const s = lg.seasons.find(x => x.year === +sub);
  if (s) return { v: "season", lg, s, tab: SEASON_TABS.some(([k]) => k === tab) ? tab : "weeks" };
  return { v: "league", lg };
}
function routeOf(p) {
  if (p.v === "players") return "players";
  if (p.v === "player") return "players/" + p.id;
  if (p.v === "league") return p.lg.id;
  if (p.v === "alltime") return p.lg.id + "/all-time";
  if (p.v === "season") return p.lg.id + "/" + p.s.year + (p.tab !== "weeks" ? "/" + p.tab : "");
  return "home";
}
function currentRoute() {
  const q = new URLSearchParams(location.search).get("p");
  if (q != null) return q;
  if (location.hash.length > 1) return decodeURIComponent(location.hash.slice(1));
  return decodeURIComponent(location.pathname.slice(BASE.length));
}
function navigate(r, push, keepScroll) {
  const url = BASE + (r === "home" ? "" : r);
  try { history[push ? "pushState" : "replaceState"](null, "", url); } catch (e) {}
  const y = window.scrollY;
  render();
  if (keepScroll) window.scrollTo(0, y); else if (push) window.scrollTo(0, 0);
}

        ${roster.map((r, i) => `<tr ${stagger(i)}><td class="rk">${i + 1}</td><td>${mgr(r.id)}</td><td class="n">${r.played || "â€”"}</td><td class="n">${r.seasons ? rec(r.w, r.l, r.t) : "â€”"}<span class="sub muted" style="display:block;font-size:12px">${pct(r)}</span></td>
          <td class="n">${trophies(r.titles, "gold")}</td><td class="n">${trophies(r.finals, "silver")}</td><td class="n">${r.poWins}</td><td class="n">${r.poApps}</td><td class="n">${r.seasons ? pts(r.pf) : "â€”"}</td><td class="n">${r.seasons ? pts(r.pa) : "â€”"}</td></tr>`).join("")}
        </tbody></table></div>

    </section>
