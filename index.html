function seasonView(lg, s, tab) {
  const base = lg.id + "/" + s.year;
  const r = rand(s.year);
  const confetti = s.champion ? `<div class="confetti">${Array.from({ length: 22 }, () => `<i style="left:${(r() * 100).toFixed(1)}%;background:${["#FFD166", "#2EC5FF", "#E6F1FF", lg.color][Math.floor(r() * 4)]};animation-duration:${(3 + r() * 4).toFixed(1)}s;animation-delay:${(-r() * 6).toFixed(1)}s"></i>`).join("")}</div>` : "";
  const ch = s.championship;
  const champ = s.champion
    ? `<section class="crown-hero">${confetti}<div class="top">${trophy("big-tro", "gold")}${av(s.champion, "xl")}
        <div><div class="label">${s.year} ${esc(lg.short)} champion${teamIds(s, s.champion).length > 1 ? "s" : ""}</div><div class="name">${teamLink(s, s.champion)}</div>
        ${s.runnerUp ? `<div class="muted" style="margin-top:6px">Runner-up: ${teamLink(s, s.runnerUp)}</div>` : ""}</div></div>
        ${ch ? `<div><div class="kicker" style="margin-bottom:8px;color:var(--gold)">Championship${ch.week ? " Â· Week " + ch.week : ""}</div>${board(ch.winner.id, ch.winner.score, ch.loser.id, ch.loser.score, s)}</div>` : ""}</section>`
    : `<section class="crown-hero pending"><div class="top">${trophy("big-tro", "dim")}<div><div class="label">${s.year} ${esc(lg.short)} champion</div>
        <div class="name">${s.status === "in-progress" ? "Still being decided" : "Not recorded yet"}</div>${s.status === "in-progress" ? `<div style="margin-top:8px"><span class="live-dot">Season live</span></div>` : ""}</div></div></section>`;

  // The table is the regular season: Rank sets the order, so a playoff run (Finish) never moves anyone.
  const rows = s.standings.map(x => ({ ...x, ...seasonRow(s, x.id) }))
    .sort((a, b) => (a.rank || 99) - (b.rank || 99) || (b.w + b.t / 2) - (a.w + a.t / 2) || (b.pf || 0) - (a.pf || 0) || (a.finish || 99) - (b.finish || 99) || teamName(s, a.id).localeCompare(teamName(s, b.id)));
  const anyRec = rows.some(x => x.hasRec || x.rank || x.finish);
  const badge = x => x.id === s.champion ? `<span class="badge-s gold">Champion</span>` : x.id === s.runnerUp ? `<span class="badge-s silver">Runner-up</span>` : x.madePlayoffs ? `<span class="badge-s po">Playoffs</span>` : "";
  const standings = rows.length
    ? `<div class="tablewrap"><table><thead><tr><th class="rk">#</th><th>Manager</th><th class="n">Record</th><th class="n">Win %</th><th class="n">Points for</th><th class="n">Points against</th><th>Result</th></tr></thead><tbody>
      ${rows.map((x, i) => `<tr ${stagger(i)}><td class="rk ${x.id === s.champion ? "gold" : ""}">${x.rank || (anyRec ? i + 1 : "â€”")}</td><td>${mgrTeam(s, x.id)}</td><td class="n">${x.hasRec ? rec(x.w, x.l, x.t) : "â€”"}</td><td class="n">${x.hasRec ? pct(x) : "â€”"}</td><td class="n">${pts(x.pf)}</td><td class="n">${pts(x.pa)}</td><td>${badge(x)}</td></tr>`).join("")}
      </tbody></table></div>
      ${anyRec ? "" : `<p class="muted" style="font-size:13px">The ${rows.length} teams that played this season. Records, points and finishes go in once they're added.</p>`}`
    : soon("Standings coming soon", "Each manager's record, points for and points against go here, with their headshot.");

  const tabs = `<nav class="tabs" aria-label="Season sections">${SEASON_TABS.map(([k, label]) => {
    const n = k === "draft" ? s.draft.length : k === "trades" ? s.trades.length : 0;
    return `<a ${go(k === "weeks" ? base : base + "/" + k)}${tab === k ? ' aria-current="page"' : ""}>${label}${n && k !== "draft" ? ` <span class="muted num">${n}</span>` : ""}</a>`;
  }).join("")}</nav>`;
  const body = tab === "draft" ? draftView(lg, s) : tab === "trades" ? tradesView(s) : tab === "lore" ? loreView(s) : weeksView(lg, s);
  const notes = [s.teams ? `${s.teams}-team league this season` : "", s.note].filter(Boolean);
  const noteStrip = notes.length ? `<div class="season-note">${notes.map(esc).join(" Â· ")}</div>` : "";

  return banner(lg, { crumbs: `<span><a ${go(lg.id)}>${esc(lg.short)}</a></span><span>${s.year}</span>`, h1: `${esc(lg.short)} ${s.year}` }, true, `<div class="sub">${shareBtn()}</div>`)
    + `<div class="wrap book" style="--c:${lg.color}">
    ${switcher(lg, s.year)}
    ${noteStrip}
    ${champ}
    <section class="section"><h2 class="sec-title">${s.year} standings</h2>${standings}</section>
    ${bracketView(lg, s)}
    <section class="section">${tabs}${body}</section>
  </div>`;
}

function board(a, as, b, bs, s) {
  const aw = as != null && bs != null && as > bs, bw = as != null && bs != null && bs > as;
  const label = id => s ? teamName(s, id) : nm(id);
  return `<div class="board"><div class="side ${aw ? "won" : ""}"><span class="nm">${esc(label(a))}</span><span class="sc">${pts(as)}</span></div><span class="vs">VS</span><div class="side r ${bw ? "won" : ""}"><span class="nm">${esc(label(b))}</span><span class="sc">${pts(bs)}</span></div></div>`;
}

/* Playoff bracket. Seeds come from the Standings tab's Seed column; results come from playoff games on
   the Games tab. Where a game isn't entered, whoever shows up in a later round (or as champion /
   runner-up) is treated as the winner, so old seasons fill in from just seeds and a champion.
   6 teams: seeds 1 and 2 have a bye; 3 v 6 and 4 v 5; 1 meets the 4/5 winner, 2 meets the 3/6 winner. */
function bracketView(lg, s) {
  const P = lg.playoffTeams || 6;
  const bySeed = {}, seedOf = {};
  s.standings.forEach(r => { if (r.seed) { bySeed[r.seed] = r.id; seedOf[r.id] = r.seed; } });
  const seeded = Object.keys(bySeed).length > 0;
  const same = (g, a, b) => (g.home === a && g.away === b) || (g.home === b && g.away === a);
  const findGame = (a, b, re) => (a && b) ? (s.games.find(g => isPlayoffRound(g.round) && same(g, a, b) && re.test(g.round)) || s.games.find(g => isPlayoffRound(g.round) && same(g, a, b))) : null;
  const inRound = re => s.games.filter(g => isPlayoffRound(g.round) && re.test(g.round)).flatMap(g => [g.home, g.away]);
  const finalists = [s.champion, s.runnerUp].filter(Boolean);
  const RE_FIRST = /quarter|wild|first|round 1/i, RE_SEMI = /semi/i, RE_FINAL = /champ|final/i;
  const semiTeams = [...inRound(RE_SEMI), ...finalists];
  const play = (a, b, re, later) => {
    const g = findGame(a, b, re);
    let sa = null, sb = null, w = null;
    if (g) { sa = g.home === a ? g.homeScore : g.awayScore; sb = g.home === a ? g.awayScore : g.homeScore; w = winnerOf(g); }
    if (!w) w = a && later.includes(a) ? a : b && later.includes(b) ? b : null;
    return { a, b, sa, sb, w, week: g ? g.week : null };
  };
  // Build rounds.
  let first = [], semis = [], labelFirst = "Wild card";
  const seedLabel = n => `Seed ${n}`;
  if (P === 8) {
    labelFirst = "Quarterfinals";
    first = [[1, 8], [4, 5], [3, 6], [2, 7]].map(([x, y]) => ({ ...play(bySeed[x], bySeed[y], RE_FIRST, semiTeams), pa: seedLabel(x), pb: seedLabel(y) }));
    semis = [[0, 1], [2, 3]].map(([i, j]) => ({ ...play(first[i].w, first[j].w, RE_SEMI, finalists), pa: `Winner ${first[i].pa.slice(5)}/${first[i].pb.slice(5)}`, pb: `Winner ${first[j].pa.slice(5)}/${first[j].pb.slice(5)}` }));
  } else if (P === 4) {
    semis = [[1, 4], [2, 3]].map(([x, y]) => ({ ...play(bySeed[x], bySeed[y], RE_SEMI, finalists), pa: seedLabel(x), pb: seedLabel(y) }));
  } else {
    first = [[4, 5], [3, 6]].map(([x, y]) => ({ ...play(bySeed[x], bySeed[y], RE_FIRST, semiTeams), pa: seedLabel(x), pb: seedLabel(y) }));
    // A league that reseeds sends the 1 seed against the lowest seed left, so pair each bye with the team it actually played.
    const g1 = bySeed[1] && s.games.find(g => isPlayoffRound(g.round) && RE_SEMI.test(g.round) && (g.home === bySeed[1] || g.away === bySeed[1]));
    const reseeded = g1 && first[1].w && (g1.home === first[1].w || g1.away === first[1].w);
    semis = (reseeded ? [[1, 1], [2, 0]] : [[1, 0], [2, 1]]).map(([top, i]) => ({ ...play(bySeed[top], first[i].w, RE_SEMI, finalists), pa: `Seed ${top} (bye)`, pb: `Winner ${first[i].pa.slice(5)}/${first[i].pb.slice(5)}` }));
  }
  let fa = semis[0].w, fb = semis[1].w;
  if (!fa && !fb && finalists.length === 2 && !seeded) { fa = s.champion; fb = s.runnerUp; }
  const fin = { ...play(fa, fb, RE_FINAL, s.champion ? [s.champion] : []), pa: "Semifinal winner", pb: "Semifinal winner" };
  if (fin.sa == null && s.championship && fin.a && fin.b) {
    const c = s.championship; fin.sa = c.winner.id === fin.a ? c.winner.score : c.loser.score; fin.sb = c.winner.id === fin.b ? c.winner.score : c.loser.score; fin.week = fin.week || c.week;
  }
  const champ = fin.w || s.champion;

  const teamRow = (id, sc, w, ph) => {
    const cls = w ? (w === id ? "win" : "lose") : "";
    return `<div class="bk-team ${id ? cls : "tbd"}"><span class="seed">${id && seedOf[id] ? seedOf[id] : ""}</span>${id ? av(id) : `<span class="av tbd">?</span>`}
      <span class="nm">${id ? esc(teamName(s, id)) : esc(ph)}</span><span class="sc num">${id && sc != null ? pts(sc) : ""}</span></div>`;
  };
  const card = (m, i) => `<div class="bk-match ${m.w ? "done" : ""}" style="animation-delay:${i * 90}ms">${teamRow(m.a, m.sa, m.w, m.pa)}${teamRow(m.b, m.sb, m.w, m.pb)}${m.week ? `<span class="bk-wk">Week ${m.week}</span>` : ""}</div>`;
  const byes = P === 6 ? `<div class="bk-byes">${[1, 2].map(n => `<div class="bk-bye">${bySeed[n] ? av(bySeed[n]) : `<span class="av tbd">?</span>`}<span><b>Seed ${n}</b> ${bySeed[n] ? esc(teamName(s, bySeed[n])) : "TBD"}</span><span class="tag">Bye</span></div>`).join("")}</div>` : "";
  const cols = [];
  if (first.length) cols.push(`<div class="bk-col"><div class="bk-h">${labelFirst}</div><div class="bk-body">${byes}${first.map(card).join("")}</div></div>`);
  cols.push(`<div class="bk-col"><div class="bk-h">Semifinals</div><div class="bk-body">${semis.map((m, i) => card(m, i + 2)).join("")}</div></div>`);
  cols.push(`<div class="bk-col"><div class="bk-h">Championship</div><div class="bk-body">${card(fin, 5)}</div></div>`);
  cols.push(`<div class="bk-col bk-champ"><div class="bk-h">Champion</div><div class="bk-body">
    <div class="bk-crown ${champ ? "" : "pending"}">${trophy("bk-tro", champ ? "gold" : "dim")}${champ ? av(champ, "lg") : ""}<span class="nm">${champ ? esc(teamName(s, champ)) : s.status === "in-progress" ? "To be decided" : "Not recorded"}</span></div></div></div>`);
  const help = seeded ? "" : `<p class="muted" style="font-size:13px">Add a <b>Seed</b> (1â€“${P}) for each playoff team on the Standings tab and the bracket fills in. Playoff results come from the Games tab (Round: ${P === 8 ? "Quarterfinal, " : P === 6 ? "Wild Card, " : ""}Semifinal, Championship).</p>`;
  return `<section class="section"><div class="section-head"><h2 class="sec-title">${s.year} playoffs</h2><span class="muted">${P}-team bracket${P === 6 ? " Â· seeds 1 and 2 get a first-round bye" : ""}</span></div>
    <div class="bracket-wrap"><div class="bracket cols-${cols.length}">${cols.join("")}</div></div>${help}</section>`;
}

function lineupTable(list, label) {
  if (!list || !list.length) return `<div class="lineup"><h4>${esc(label)}</h4><p class="muted" style="font-size:14px">Lineup not added yet.</p></div>`;
  const ord = x => { const i = SLOT_ORDER.indexOf(x.slot); return i < 0 ? 50 : i; };
  const starters = list.filter(x => !isBench(x.slot)).sort((a, b) => ord(a) - ord(b));
  const bench = list.filter(x => isBench(x.slot));
  const total = starters.reduce((n, x) => n + (x.pts || 0), 0);
  const row = (x, cls) => `<tr class="${cls}"><td class="slot">${esc(x.slot || x.pos || "â€”")}</td><td>${esc(x.player)}${x.pos && x.pos !== x.slot ? ` <span class="muted" style="font-size:12px">${esc(x.pos)}</span>` : ""}${x.nfl ? ` <span class="muted num" style="font-size:12px">${esc(x.nfl)}</span>` : ""}</td><td class="n">${x.pts == null ? "â€”" : pts(x.pts)}</td></tr>`;
  return `<div class="lineup"><h4>${esc(label)}</h4><table><tbody>
    ${starters.map(x => row(x, "")).join("")}
    ${starters.length ? `<tr><td></td><td class="muted" style="font-size:12px;letter-spacing:.1em;text-transform:uppercase">Starters total</td><td class="n"><b>${pts(total)}</b></td></tr>` : ""}
    ${bench.length ? `<tr class="bench"><td colspan="3" class="muted" style="font-size:12px;letter-spacing:.12em;text-transform:uppercase;padding-top:10px">Bench</td></tr>${bench.map(x => row(x, "bench")).join("")}` : ""}
  </tbody></table></div>`;
}

function weeksView(lg, s) {
  // A season's own Weeks (Seasons tab) wins over the league's, for years with a shorter schedule.
  const maxWeek = Math.max(s.weeks || lg.weeks, ...s.games.map(g => g.week));
  const weeks = Array.from({ length: maxWeek }, (_, i) => i + 1);
  return `<div class="weeks-list">${weeks.map((w, i) => {
    const games = s.games.filter(g => g.week === w);
    const round = (games.find(g => g.round && !/regular/i.test(g.round)) || {}).round;
    return `<details class="wk" ${stagger(i, 25)}><summary><span class="wn">Week ${w}</span>${round ? `<span class="round">${esc(round)}</span>` : ""}
      <span class="meta">${games.length ? `${games.length} matchup${games.length === 1 ? "" : "s"}` : "No results yet"}</span><span class="chev"></span></summary>
      <div class="wk-body">${games.length ? games.map(g => {
        const win = winnerOf(g);
        const side = (id, sc, r) => `<span class="side ${r ? "r" : ""} ${win ? (win === id ? "won" : "lost") : ""}">${av(id)}<span class="nm">${esc(teamName(s, id))}</span><span class="sc">${pts(sc)}</span></span>`;
        return `<details class="mu"><summary>${side(g.home, g.homeScore)}<span class="vs">${g.round && !/regular/i.test(g.round) ? esc(g.round) : "VS"}</span>${side(g.away, g.awayScore, true)}<span class="chev"></span></summary>
          <div class="lineups">${lineupTable(s.lineups[w + "|" + g.home], teamName(s, g.home))}${lineupTable(s.lineups[w + "|" + g.away], teamName(s, g.away))}</div></details>`;
      }).join("") : `<p class="muted" style="font-size:14px;margin:4px">Week ${w} matchups haven't been added yet.</p>`}</div></details>`;
  }).join("")}</div>
  <p class="muted" style="font-size:13px">Open a week to see its matchups, then open a matchup to see both lineups, starters and bench.</p>`;
}

function draftView(lg, s) {
  const intro = lg.type === "Dynasty"
    ? `${esc(lg.short)} is a dynasty league: rosters carry over from year to year, so this is the ${s.year} draft (the startup draft in year one, rookies after that).`
    : `${esc(lg.short)} is a redraft league: every team drafts a brand-new roster each year.`;
  if (!s.draft.length) return `<p class="muted">${intro}</p>` + soon(`${s.year} draft coming soon`, "Every pick, round by round: who drafted whom.");
  // Columns are the teams in round-1 order; each pick lands in its team's column on its round's row.
  const rounds = [...new Set(s.draft.map(d => d.round))].sort((a, b) => (a ?? 99) - (b ?? 99));
  const cols = [...new Set(s.draft.filter(d => d.round === rounds[0]).map(d => d.id))];
  for (const d of s.draft) if (!cols.includes(d.id)) cols.push(d.id);
  const n = cols.length;
  const cell = {};
  for (const d of s.draft) {
    const row = (cell[d.round] ||= Array(n).fill(null));
    let c = cols.indexOf(d.id);
    if (row[c]) c = row.indexOf(null); // a team with two picks in a round (traded pick) takes a free spot
    if (c >= 0) row[c] = d;
  }
  // Snake: round 2 starts with the team that picked last in round 1.
  const r2 = s.draft.find(d => d.round === rounds[1]);
  const snake = !!r2 && cols.indexOf(r2.id) === n - 1;
  const posKey = p => ({ DST: "DEF", "D/ST": "DEF", PK: "K" })[p] || p;
  const POS = ["QB", "RB", "WR", "TE", "K", "DEF"];
  const count = p => s.draft.filter(d => posKey(d.pos) === p).length;
  const order = s.draft.slice().sort((a, b) => (a.pick ?? 9999) - (b.pick ?? 9999));
  const card = (d, rd) => {
    if (!d) return `<div class="dp empty"></div>`;
    const p = posKey(d.pos), k = d.pick == null ? null : d.pick > n ? d.pick - ((rd || 1) - 1) * n : d.pick;
    const parts = String(d.player).trim().split(/\s+/), last = parts.length > 1 ? parts.slice(1).join(" ") : parts[0], first = parts.length > 1 ? parts[0] : "";
    return `<div class="dp dpos-${POS.includes(p) ? p : "X"}" data-p="${esc(p)}" style="animation-delay:${order.indexOf(d) * 22}ms" title="${esc(`${d.player} Â· ${d.pos || "â€”"} Â· ${d.nfl || "â€”"} Â· ${teamName(s, d.id)}`)}">
      <span class="top"><b>${rd ?? "â€”"}.${k == null ? "â€”" : String(k).padStart(2, "0")}</b><span>${esc(p || "â€”")}${d.nfl ? " Â· " + esc(d.nfl) : ""}</span></span>
      <span><span class="fn">${esc(first)}</span><span class="ln">${esc(last)}</span></span></div>`;
  };
  return `<p class="muted">${intro}</p>
  <div class="dbar">${POS.filter(count).map(p => `<button class="dchip dpos-${p}" data-dfilter="${p}" aria-pressed="false">${p} <b>${count(p)}</b></button>`).join("")}<button class="dchip replay" data-dreplay>Replay draft</button></div>
  <div class="dboard-wrap"><div class="dboard play" style="--n:${n}">
    <div></div>${cols.map(id => `<div class="dhead">${av(id)}<a ${go("players/" + id)}>${esc(teamName(s, id))}</a></div>`).join("")}
    ${rounds.map((rd, i) => `<div class="dround">R${rd ?? "â€”"}${snake ? `<i>${i % 2 ? "â†" : "â†’"}</i>` : ""}</div>${(cell[rd] || []).map(d => card(d, rd)).join("")}`).join("")}
  </div></div>
  <p class="muted" style="font-size:13px">${s.draft.length} picks${snake ? ", snake order" : ""}. Tap a position to highlight it, or replay the draft.</p>`;
}
// Draft board: position filter and replay.
document.addEventListener("click", e => {
  const f = e.target.closest("[data-dfilter]"), r = e.target.closest("[data-dreplay]");
  if (!f && !r) return;
  const board = document.querySelector(".dboard");
  if (!board) return;
  if (r) {
    delete board.dataset.f;
    document.querySelectorAll("[data-dfilter]").forEach(b => b.setAttribute("aria-pressed", "false"));
    board.classList.remove("play"); void board.offsetWidth; board.classList.add("play");
    return;
  }
  const on = board.dataset.f !== f.dataset.dfilter;
  board.classList.remove("play"); // the deal animation holds opacity, so it has to end before dimming works
  if (on) board.dataset.f = f.dataset.dfilter; else delete board.dataset.f;
  document.querySelectorAll("[data-dfilter]").forEach(b => b.setAttribute("aria-pressed", String(on && b === f)));
});

function tradesView(s) {
  if (!s.trades.length) return soon(`No trades recorded for ${s.year}`, "Every trade that went down this season shows here: who sent what, and when.");
  const swap = `<svg class="swap" viewBox="0 0 40 40" aria-hidden="true"><g class="a1"><path d="M6 14h26l-6-6" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g><g class="a2"><path d="M34 26H8l6 6" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g></svg>`;
  return `<div class="trades">${s.trades.map((t, i) => `<article class="trade" ${stagger(i, 60)}>
    <span class="when">${[t.week ? "Week " + t.week : "", t.date].filter(Boolean).map(esc).join(" Â· ") || "Trade"}</span>
    <div class="side">${mgrTeam(s, t.a)}<span class="gets">Receives</span><ul>${t.aGets.map(x => `<li>${esc(x)}</li>`).join("") || "<li class='muted'>â€”</li>"}</ul></div>
    ${swap}
    <div class="side">${mgrTeam(s, t.b)}<span class="gets">Receives</span><ul>${t.bGets.map(x => `<li>${esc(x)}</li>`).join("") || "<li class='muted'>â€”</li>"}</ul></div>
    ${t.note ? `<p class="note">${esc(t.note)}</p>` : ""}</article>`).join("")}</div>`;
}

function loreView(s) {
  const lore = s.lore ? `<div class="panel"><p class="lore">${esc(s.lore)}</p></div>` : soon("Lore drop coming soon", `The story of the ${s.year} season (the rivalries, the trades, the collapse nobody saw coming) goes here.`);
  const awards = s.awards.length ? `<h3 class="sec-title" style="font-size:18px;margin-top:8px">Season awards</h3><div class="awards">${s.awards.map(a => `<div class="award"><span class="t">${esc(a.title)}</span><span class="w">${a.id ? plink(a.id) : "â€”"}</span>${a.note ? `<span class="d">${esc(a.note)}</span>` : ""}</div>`).join("")}</div>` : "";
  return lore + awards;
}

// A headshot inside a spinning ring made of the colors of every league the person plays in.
function ringAv(id, size, lgs) {
  const cols = lgs.length ? lgs.map(l => l.color) : ["#2EC5FF", "#3D7BFF"];
  return `<span class="ring-av" style="--stops:${[...cols, cols[0]].join(", ")}">${av(id, size)}</span>`;
}

function playersView() {
  const list = D.managers.map(m => ({ m, lgs: playerLeagues(m.id) }))
    .sort((a, b) => b.lgs.length - a.lgs.length || a.m.name.localeCompare(b.m.name));
  const filters = [["all", "All leagues", "var(--neon)"], ...D.leagues.map(l => [l.id, l.short, l.color])];
  return `<section class="players-hero"><div class="hero-field" aria-hidden="true"></div><div class="wrap">
      <span class="portal-ico" style="--c:var(--ice)">${LOGOS.players}</span>
      <div><span class="kicker">All leagues Â· ${D.managers.length} managers</span><h1>Players</h1>
      <p class="muted">Everyone across the BAM leagues. Open a player for their titles, playoff runs, records and a league-by-league breakdown.</p></div>
    </div></section>
    <div class="wrap view body-pad">
      <div class="pf-filter" role="group" aria-label="Show players from">${filters.map(([k, label, c], i) => `<button type="button" data-filter="${k}" aria-pressed="${i === 0}" style="--c:${c}">${esc(label)}</button>`).join("")}</div>
      <div class="players">${list.map(({ m, lgs }, i) => `<a class="pcard2" data-leagues="${lgs.map(l => l.id).join(" ")}" ${stagger(i, 45)} ${go("players/" + m.id)}>
        <span class="shine-sweep" style="animation-delay:${(i % 7) * .8}s"></span>
        ${ringAv(m.id, "lg", lgs)}
        <div><h3>${esc(m.name)}</h3>${m.nickname ? `<span class="muted">â€œ${esc(m.nickname)}â€</span>` : ""}</div>
        <div class="chips">${lgs.map(lg => `<span class="lgtag" style="--c:${lg.color}">${esc(lg.short)}</span>`).join("") || '<span class="muted">No league yet</span>'}</div>
        <span class="go-p">View profile â†’</span></a>`).join("")}</div>
    </div>`;
}

function statTiles(s) {
  const tile = (k, v, opts = {}) => `<div class="tile ${opts.cls || ""}" ${stagger(opts.i || 0, 60)}>${opts.ico || ""}<span class="k">${k}</span><span class="v num" ${opts.count != null ? `data-count="${opts.count}"${opts.dec ? ` data-dec="${opts.dec}"` : ""}` : ""}>${v}</span></div>`;
  return `<div class="stat-tiles">
    ${tile("Titles", s.titles, { cls: "gold", ico: trophy("tile-ico", "gold"), count: s.titles, i: 0 })}
    ${tile("Finals appearances", s.finals, { cls: "silver", ico: trophy("tile-ico", "silver"), count: s.finals, i: 1 })}
    ${tile("Playoff appearances", s.poApps, { count: s.poApps, i: 2 })}
    ${tile("Playoff wins", s.poWins, { count: s.poWins, i: 3 })}
    ${tile("Record", s.seasons ? rec(s.w, s.l, s.t) : "â€”", { i: 4 })}
    ${tile("Win %", pct(s), { i: 5 })}
    ${tile("Points for", s.seasons ? pts(s.pf) : "â€”", s.seasons ? { count: s.pf, dec: 1, i: 6 } : { i: 6 })}
  </div>`;
}

function playerView(id) {
  const m = M[id], lgs = playerLeagues(id), t = playerTotals(id);
  const c = lgs.length ? lgs[0].color : "var(--neon)";
  const cols = lgs.length ? lgs.map(l => l.color) : ["#2EC5FF", "#3D7BFF"];
  const photo = m.photo ? imgUrl(m.photo) : "";
  return `<section class="player-hero" style="--c:${c}">${photo ? `<div class="hero-bg" style="background-image:url('${esc(photo)}')"></div>` : ""}<div class="hero-field" aria-hidden="true"></div><div class="wrap">
      <div class="photo-frame" style="--stops:${[...cols, cols[0]].join(", ")}"><div class="photo-inner">
        ${photo ? `<img src="${esc(photo)}" alt="${esc(m.name)}">` : `<span class="initials">${esc(initials(m.name))}</span>`}
        <span class="shine-sweep"></span></div></div>
      <div class="who"><div class="crumbs"><a ${go("home")}>Hub</a><span><a ${go("players")}>Players</a></span><span>${esc(m.name)}</span></div>
        <h1>${esc(m.name)}</h1>${m.nickname ? `<div class="muted">â€œ${esc(m.nickname)}â€</div>` : ""}
        <div class="chips">${lgs.map(lgtag).join("") || '<span class="muted">Not in a league yet</span>'}</div></div>
      ${shareBtn()}
    </div></section>
    <div class="wrap book">
      <section class="section"><h2 class="sec-title">Career Â· all leagues</h2>${statTiles(t)}</section>
      ${lgs.map(lg => {
        const s = leagueStats(lg, id);
        const rows = lg.seasons.map(se => ({ se, x: seasonRow(se, id) })).filter(({ se, x }) => x.r || x.finalist);
        return `<section class="league-block" style="--c:${lg.color}">
          <div class="lb-head"><span class="portal-ico small">${LOGOS[LOGO_FOR[lg.id] || "football"]}</span>
            <div><h2>${esc(lg.name)}</h2><span class="muted">${lg.type} Â· ${yearSpan(lg)}</span></div>
            <a class="lgtag" style="--c:${lg.color}" ${go(lg.id)}>League page â†’</a></div>
          ${statTiles(s)}
          ${rows.length ? `<div class="tablewrap"><table><thead><tr><th>Season</th><th class="n">Finish</th><th class="n">Record</th><th class="n">Points for</th><th class="n">Points against</th><th>Result</th></tr></thead><tbody>
            ${rows.map(({ se, x }, i) => `<tr ${stagger(i)}><td><a ${go(lg.id + "/" + se.year)}>${se.year}</a></td><td class="n">${x.r && x.r.finish ? ordinal(x.r.finish) : "â€”"}</td><td class="n">${x.r && x.r.hasRec ? rec(x.r.w, x.r.l, x.r.t) : "â€”"}</td><td class="n">${x.r ? pts(x.r.pf) : "â€”"}</td><td class="n">${x.r ? pts(x.r.pa) : "â€”"}</td>
              <td>${onTeam(se, se.champion, id) ? '<span class="badge-s gold">Champion</span>' : onTeam(se, se.runnerUp, id) ? '<span class="badge-s silver">Runner-up</span>' : x.madePlayoffs ? '<span class="badge-s po">Playoffs</span>' : ""}${teamIds(se, x.r && x.r.id).length > 1 ? ` <span class="badge-s po">Co-managed with ${esc(teamIds(se, x.r.id).filter(o => o !== id).map(nm).join(" & "))}</span>` : ""}</td></tr>`).join("")}
            </tbody></table></div>`
            : soon("Season results coming soon", `${esc(m.name)}'s ${esc(lg.short)} seasons show here once standings are added.`)}
        </section>`;
      }).join("")}
    </div>`;
}

// Wide screens show the whole banner scene; narrow phones zoom into its middle so the action stays big.
function fitScenes() {
  document.querySelectorAll(".stage .scene").forEach(svg => {
    const r = svg.getBoundingClientRect();
    svg.setAttribute("preserveAspectRatio", r.width / Math.max(1, r.height) >= 2.2 ? "xMidYMid meet" : "xMidYMid slice");
  });
}
window.addEventListener("resize", fitScenes);

// Numbers marked data-count tick up from zero when a page opens.
function countUp(root) {
  root.querySelectorAll("[data-count]").forEach(el => {
    const end = parseFloat(el.dataset.count), dec = +(el.dataset.dec || 0);
    if (!isFinite(end) || REDUCED) return;
    const t0 = performance.now(), dur = 900;
    const fmt = v => dec ? v.toLocaleString(undefined, { minimumFractionDigits: dec, maximumFractionDigits: dec }) : Math.round(v).toLocaleString();
    const step = t => { const k = Math.min(1, (t - t0) / dur), e = 1 - Math.pow(1 - k, 3); el.textContent = fmt(end * e); if (k < 1) requestAnimationFrame(step); };
    requestAnimationFrame(step);
  });
}

function render() {
  const p = parse(currentRoute());
  renderNav(p);
  const app = $("#app");
  if (p.v === "home") app.innerHTML = homeView();
  else if (p.v === "players") app.innerHTML = playersView();
  else if (p.v === "player") app.innerHTML = playerView(p.id);
  else if (p.v === "alltime") app.innerHTML = allTimeView(p.lg);
  else if (p.v === "season") app.innerHTML = seasonView(p.lg, p.s, p.tab);
  else app.innerHTML = leagueView(p.lg);
  fitScenes();
  countUp(app);
  app.querySelectorAll("[data-filter]").forEach(b => b.onclick = () => {
    app.querySelectorAll("[data-filter]").forEach(x => x.setAttribute("aria-pressed", String(x === b)));
    app.querySelectorAll(".pcard2").forEach(card => { card.hidden = b.dataset.filter !== "all" && !card.dataset.leagues.split(" ").includes(b.dataset.filter); });
  });
  if (REDUCED) app.querySelectorAll("svg").forEach(svg => svg.pauseAnimations && svg.pauseAnimations());
  document.title = p.v === "home" ? "BAM Fantasy"
    : `${p.v === "season" ? p.lg.short + " " + p.s.year : p.v === "alltime" ? p.lg.short + " all time" : p.lg ? p.lg.short : p.v === "player" ? M[p.id].name : "Players"} Â· BAM Fantasy`;
}

(async function start() {
  try {
    const tables = {};
    await Promise.all(TABS.map(async tab => { tables[tab] = await fetchTab(tab); }));
    build(tables);
    const logo = $(".logo"); logo.href = BASE; logo.dataset.r = "home";
    navigate(routeOf(parse(currentRoute())), false);
  } catch (err) {
    const usingSheet = !!(window.BAM_CONFIG && window.BAM_CONFIG.sheetId);
    $("#app").innerHTML = `<div class="wrap"><div class="loaderr"><strong>The league data didn't load</strong>
      <span>${usingSheet
        ? "Check that the Google Sheet is shared as <b>Anyone with the link â†’ Viewer</b>, that the ID in config.js is right, and that the Leagues, Managers and Seasons tabs are named exactly that."
        : "Open the site from its web address (GitHub Pages), not by double-clicking the file. Browsers block the data files when a page is opened straight from your computer."}</span>
      <code>${esc(err.message)}</code></div></div>`;
  }
})();
</script>
